name = "nanotab-publish"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# --- NanoTab publish worker (MVP step 2: hosted one-click paywalls) ---
# Auth is a shared-secret stub: set it via secret, NEVER commit it:
#   wrangler secret put PUBLISH_KEY
# Local dev: wrangler dev --var PUBLISH_KEY:dev-secret
# Real magic-link auth replaces the stub in step 4.
# Create for real (NOT done yet — local dev emulates both):
#   wrangler kv namespace create NANOTAB_LISTINGS
#   wrangler r2 bucket create nanotab-content
[vars]
NANOTAB_FEE_BPS = "200"
MAX_PRICE_CENTS = "10000"
NETWORK = "base"
ASSET = "0x833589fcD6eDB6e08f4C7c32d4f71B54BdA4B4E5"

# R2 bucket nanotab-content: bytes live here (key `r/<slug>`); KV `rb:<slug>`
# is the automatic fallback when the binding is absent or a write fails.
[[r2_buckets]]
binding = "NANOTAB_CONTENT"
bucket_name = "nanotab-content"

[[kv_namespaces]]
binding = "NANOTAB_LISTINGS"
id = "16da9592a9d54fa4976a20754203e5db"

[dev]
port = 8788
