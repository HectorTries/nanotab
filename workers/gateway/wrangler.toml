name = "nanotab-gateway"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# --- NanoTab config: MAINNET (Base, USDC 0x833589fcD6eDB6e08f4C7c32d4f71B54BdA4B4E5) ---
# Hector must set the real merchant address:
#   wrangler secret put MERCHANT_WALLET   (or edit [vars] below)
# Optional on-chain settlement + fee wallet:
#   wrangler secret put SETTLER_KEY       (settler private key — NEVER commit)
#   wrangler secret put FEE_WALLET        (NanoTab fee recipient)
[vars]
ORIGIN_URL = "https://origin.nanotab.dev"
PRICE_USD_CENTS = "2"
MERCHANT_WALLET = "0xc47b6d6a4137373ab169aeeedb95971d4939ef0b"
NANOTAB_FEE_BPS = "50"
NETWORK = "base"
ASSET = "0x833589fcD6eDB6e08f4C7c32d4f71B54BdA4B4E5"

[dev]
port = 8787
